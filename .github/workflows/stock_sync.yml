name: Sync Inventory Stock

on:
  repository_dispatch:
    types: [webhook_stock_sync]

permissions:
  contents: write

jobs:
  update-stock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Process Stock Sync Payload
        id: process-payload
        run: |
          node -e '
            const fs = require("fs");
            
            // Access the incoming array directly from the custom payload field
            const payload = ${{ toJson(github.event.client_payload) }};
            
            if (!payload) {
              console.error("Error: No payload found in the event.");
              process.exit(1);
            }
            
            const existingPath = "./products.json";
            let products = [];
            
            if (fs.existsSync(existingPath)) {
              try {
                products = JSON.parse(fs.readFileSync(existingPath, "utf8"));
              } catch (e) {
                console.log("Existing file was empty or invalid JSON. Initializing empty array.");
                products = [];
              }
            }
            
            // Case 1: Payload is an array (Direct overwrite)
            if (Array.isArray(payload)) {
              console.log("Payload is an array. Writing directly to products.json...");
              fs.writeFileSync(existingPath, JSON.stringify(payload, null, 2), "utf8");
            } 
            // Case 2: Payload is an object containing product listings
            else if (typeof payload === "object") {
              console.log("Payload is an object. Evaluating stock updates...");
              
              // Direct fallback if the payload is a flat object map
              fs.writeFileSync(existingPath, JSON.stringify(payload, null, 2), "utf8");
            } else {
              console.error("Error: Unknown payload format.");
              process.exit(1);
            }
          '

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add products.json
          git commit -m "chore: sync stock via Make.com dispatch payload [skip ci]" || echo "No changes to commit"
          git push
